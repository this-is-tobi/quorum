name: CD

on:
  push:
    branches:
    - main
    paths-ignore:
    - ".github/**"
  workflow_dispatch:

permissions: {}

jobs:
  expose-vars:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # The Bun that compiles the binaries and publishes to npm is the one pinned in mise.toml
      BUN_VERSION: ${{ steps.versions.outputs.BUN_VERSION }}
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Exposing versions pinned in mise.toml
      id: versions
      run: |
        version="$(sed -n 's/^bun = "\(.*\)"/\1/p' mise.toml)"
        # An empty pin would build the release with whichever Bun is the latest
        [ -n "$version" ] || { echo "::error::No Bun version is pinned in mise.toml"; exit 1; }
        echo "BUN_VERSION=$version" >> "$GITHUB_OUTPUT"

  # The four binaries and their checksums are built on every push, before the release, so that the release
  # job can attach them to the release it creates, from the commit it tags. They are the only thing in
  # bin/release/, flat: release-app uploads every file of the artifact as a release asset.
  build-binaries:
    runs-on: ubuntu-latest
    needs:
    - expose-vars
    permissions:
      contents: read
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ needs.expose-vars.outputs.BUN_VERSION }}

    - name: Install production dependencies
      run: bun install --frozen-lockfile --production --ignore-scripts

    - name: Compile the release binaries
      run: bun run compile:release

    # About 390 MB, made on every push to main and consumed by the release job of the same run
    - name: Upload the binaries
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: quorum-binaries
        path: bin/release/
        if-no-files-found: error
        retention-days: 3

  # release-please releases every merged release pull request still labelled "autorelease: pending", and tags
  # that pull request's merge commit, whatever commit this run is on. So when the run of a release commit
  # fails before release-please, the next run on the branch creates that release from its own commit: the
  # tag is on the release commit, and the binaries, the package and the image come from another one.
  # release-app attaches the binaries itself, so only a job that runs before it can refuse that run.
  release-guard:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # lists the merged release pull requests
    steps:
    - name: Check that no other release commit waits to be released
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail

        # The release pull requests of this branch, as release-app finds them: its head branch is
        # release-please--branches--<branch>, with a component suffix in a monorepo. A failing call fails the
        # step, since a plain assignment keeps the exit status of gh, and a merge commit that cannot be read
        # counts as another commit.
        export PR_BRANCH_PREFIX="release-please--branches--$GITHUB_REF_NAME"
        waiting=$(gh pr list --state merged --label "autorelease: pending" --base "$GITHUB_REF_NAME" --limit 100 \
          --json number,mergeCommit,headRefName \
          --jq '[ .[]
                  | select(.headRefName | startswith(env.PR_BRANCH_PREFIX))
                  | select(.mergeCommit.oid != env.GITHUB_SHA)
                  | "#\(.number) merged as \(.mergeCommit.oid)" ] | join(", ")')

        if [ -n "$waiting" ]; then
          echo "::error::Merged and not yet released: $waiting. This run is on $GITHUB_SHA, which is not that commit, so release-please would release it from here: the tag on the release commit, the binaries, the package and the image built from this one. Re-run the CD run of the release commit with 'Re-run all jobs', which keeps its commit; a manual dispatch builds the head of the branch."
          exit 1
        fi

        echo "No merged release pull request waits to be released from another commit than $GITHUB_SHA"

  release:
    uses: this-is-tobi/github-workflows/.github/workflows/release-app.yml@v0
    needs:
    - build-binaries
    - release-guard
    permissions:
      contents: write # tags the release, creates it and attaches the binaries
      issues: write # labels the release pull request
      pull-requests: write # opens and updates the release pull request
    with:
      TAG_MAJOR_AND_MINOR: true
      RELEASE_ARTIFACT_NAMES: quorum-binaries
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  # Build provenance for each binary the release carries, verifiable with `gh attestation verify`.
  # SHA256SUMS is a list of digests, not a program, and is not attested.
  attest-binaries:
    runs-on: ubuntu-latest
    if: ${{ needs.release.outputs.release-created == 'true' }}
    needs:
    - release
    permissions:
      id-token: write # asks for the signing certificate of the attestation
      attestations: write # stores the attestation
    steps:
    - name: Download the binaries
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: quorum-binaries
        path: bin/release

    - name: Attest the build provenance of the binaries
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: |
          bin/release/quorum-linux-x64
          bin/release/quorum-linux-arm64
          bin/release/quorum-darwin-x64
          bin/release/quorum-darwin-arm64

  npm:
    uses: this-is-tobi/github-workflows/.github/workflows/release-npm.yml@v0
    if: ${{ needs.release.outputs.release-created == 'true' }}
    needs:
    - expose-vars
    - release
    permissions:
      contents: read
      id-token: write # trusted publishing: the registry takes the workflow's identity as the credential
    with:
      RUNTIME: bun
      RUNTIME_VERSION: ${{ needs.expose-vars.outputs.BUN_VERSION }}
      PACKAGE_MANAGER: bun
      BUILD_COMMAND: bun run build
      # Trusted publishing already attaches it, this fails the release if it ever stops
      PROVENANCE: true
    # No NPM_TOKEN: publishing relies on the npmjs.com trusted publisher (OIDC)
    # registered for this repository and workflow file, via id-token: write

  docker:
    uses: this-is-tobi/github-workflows/.github/workflows/build-docker.yml@v0
    if: ${{ needs.release.outputs.release-created == 'true' }}
    needs:
    - release
    permissions:
      contents: read
      packages: write # pushes the image to ghcr.io
    with:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/quorum
      IMAGE_TAG: ${{ needs.release.outputs.version }}
      IMAGE_DOCKERFILE: ./Dockerfile
      IMAGE_CONTEXT: ./
      TAG_MAJOR_AND_MINOR: true
      LATEST_TAG: true

  # SLSA provenance (GitHub attestation), SPDX SBOM and keyless cosign signature
  # for the released image, verifiable with `gh attestation verify` and `cosign`.
  attest:
    uses: this-is-tobi/github-workflows/.github/workflows/attest-docker.yml@v0
    needs:
    - docker
    permissions:
      packages: write # pushes the signature and the SBOM beside the image
      id-token: write # asks for the signing certificates
      attestations: write # stores the provenance
    with:
      IMAGE_NAME: ${{ needs.docker.outputs.image }}
      DIGEST: ${{ needs.docker.outputs.digest }}
      PROVENANCE: true
      SBOM: true
      SIGN: true

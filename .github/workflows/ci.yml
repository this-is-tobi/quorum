name: CI

on:
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    - ready_for_review
    branches:
    - "**"
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.0

jobs:
  expose-vars:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    outputs:
      BUN_VERSION: ${{ env.BUN_VERSION }}
    steps:
    - name: Exposing env vars
      run: echo "Exposing env vars"

  lint:
    uses: this-is-tobi/github-workflows/.github/workflows/lint-js.yml@v0
    needs:
    - expose-vars
    with:
      RUNTIME: bun
      RUNTIME_VERSION: ${{ needs.expose-vars.outputs.BUN_VERSION }}
      PACKAGE_MANAGER: bun

  typecheck:
    runs-on: ubuntu-latest
    needs:
    - expose-vars
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ needs.expose-vars.outputs.BUN_VERSION }}

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Run typecheck
      run: bun run typecheck

    # The build can fail where the typecheck passes (rootDir, declarations); the release's own run would be the first to say so
    - name: Build the npm package
      run: bun run build

  test:
    uses: this-is-tobi/github-workflows/.github/workflows/test-vitest.yml@v0
    needs:
    - expose-vars
    with:
      RUNTIME: bun
      RUNTIME_VERSION: ${{ needs.expose-vars.outputs.BUN_VERSION }}
      PACKAGE_MANAGER: bun
      COVERAGE: true

  lint-commits:
    uses: this-is-tobi/github-workflows/.github/workflows/lint-commits.yml@v0
    needs:
    - expose-vars
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read

  scan-secrets:
    uses: this-is-tobi/github-workflows/.github/workflows/scan-gitleaks.yml@v0
    needs:
    - expose-vars
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      PR_NUMBER: ${{ github.event.pull_request.number }}

  # Workaround for required status check in protection branches (see. https://github.com/orgs/community/discussions/13690)
  all-jobs-passed:
    name: Check jobs status
    if: ${{ always() }}
    needs:
    - expose-vars
    - lint
    - typecheck
    - test
    - lint-commits
    - scan-secrets
    uses: this-is-tobi/github-workflows/.github/workflows/check-jobs.yml@v0
    with:
      NEEDS: ${{ toJson(needs) }}
